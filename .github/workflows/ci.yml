name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # isolated-vm (a webcrack dependency) needs a native build; no test loads webcrack.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run typecheck:strict
      - run: npm test
